<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="400" viewBox="0 0 1280 400" role="img" aria-labelledby="title desc">
  <title id="title">PND Adam Pro simulation control platform</title>
  <desc id="desc">ROS 2, MoveIt 2 and MuJoCo connected through a Python DDS bridge. 31 body and 12 hand state channels.</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#101f31"/><stop offset="1" stop-color="#132e3b"/></linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#fff" stroke-opacity=".035"/></pattern>
    <linearGradient id="line"><stop stop-color="#51d9bf"/><stop offset="1" stop-color="#8bc8ee"/></linearGradient>
  </defs>
  <rect width="1280" height="400" rx="20" fill="url(#bg)"/>
  <rect width="1280" height="400" rx="20" fill="url(#grid)"/>
  <g font-family="Segoe UI,Arial,sans-serif">
    <rect x="52" y="44" width="6" height="22" rx="3" fill="#51d9bf"/>
    <text x="74" y="62" font-size="19" font-weight="700" letter-spacing="3" fill="#94ded0">PND ADAM PRO</text>
    <text x="52" y="137" font-size="52" font-weight="700" letter-spacing="-1.2" fill="#f3f7fc">Plan. Execute. Observe.</text>
    <text x="54" y="179" font-size="21" fill="#bdccda">ROS 2 + MoveIt 2 + MuJoCo</text>
    <text x="54" y="212" font-size="17" fill="#8fa8bb">Motion planning and simulation control for humanoid robotics</text>
    <g transform="translate(54 257)">
      <rect width="226" height="90" rx="12" fill="#fff" fill-opacity=".045" stroke="#fff" stroke-opacity=".1"/>
      <text x="20" y="37" font-size="28" font-weight="700" fill="#f3f7fc">31 + 12</text>
      <text x="20" y="66" font-size="15" fill="#9fb7c8">Body + hand state channels</text>
      <rect x="242" width="226" height="90" rx="12" fill="#fff" fill-opacity=".045" stroke="#fff" stroke-opacity=".1"/>
      <text x="262" y="37" font-size="25" font-weight="700" fill="#f3f7fc">ROS ↔ DDS</text>
      <text x="262" y="66" font-size="15" fill="#9fb7c8">Python control bridge</text>
      <rect x="484" width="226" height="90" rx="12" fill="#fff" fill-opacity=".045" stroke="#fff" stroke-opacity=".1"/>
      <text x="504" y="37" font-size="25" font-weight="700" fill="#f3f7fc">RViz → MuJoCo</text>
      <text x="504" y="66" font-size="15" fill="#9fb7c8">Trajectory + state feedback</text>
    </g>
    <path d="M829 48V352" stroke="#81bcc8" stroke-opacity=".2"/>
    <g transform="translate(1030 181)" fill="none" stroke="url(#line)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round">
      <circle r="114" stroke-width="1" stroke-opacity=".18"/>
      <circle r="142" stroke-width="1" stroke-opacity=".1" stroke-dasharray="4 10"/>
      <rect x="-22" y="-111" width="44" height="38" rx="12"/>
      <path d="M-10-93H10M0-73V-54M-45-49L0-57 45-49 33 23H-33ZM-45-49L-65 9-70 62M45-49L65 9 70 62M-33 23L-34 85-43 130H-14M33 23L34 85 43 130H14M-33 23H33"/>
      <g fill="#51d9bf" stroke="#132e3b" stroke-width="3"><circle cx="-45" cy="-49" r="7"/><circle cx="45" cy="-49" r="7"/><circle cx="-65" cy="9" r="7"/><circle cx="65" cy="9" r="7"/><circle cy="23" r="7"/><circle cx="-34" cy="85" r="7"/><circle cx="34" cy="85" r="7"/></g>
    </g>
    <text x="1030" y="365" text-anchor="middle" font-size="13" letter-spacing="2" fill="#8fa8bb">SIMULATION WORKSPACE</text>
  </g>
</svg>
