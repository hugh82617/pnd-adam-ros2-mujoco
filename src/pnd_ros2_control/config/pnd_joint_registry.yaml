    - {sdk_name: RightElbow, ros_name: right_elbow_joint, sdk: 25, ctrl: 25, group: right_arm, kp: 9, kd: 0.9}
    - {sdk_name: RightWristRoll, ros_name: right_wrist_roll_joint, sdk: 26, ctrl: 28, group: right_arm, kp: 9, kd: 0.9}
