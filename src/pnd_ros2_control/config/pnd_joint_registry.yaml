    state_interface: [position]
  joints:
    - {ros_name: left_pinky_joint, hand_index: 0}
    - {ros_name: left_ring_joint, hand_index: 1}
    - {ros_name: left_middle_joint, hand_index: 2}
    - {ros_name: left_index_joint, hand_index: 3}
    - {ros_name: left_thumb_joint, hand_index: 4}
    - {ros_name: left_thumb_lateral_joint, hand_index: 5}
    - {ros_name: right_pinky_joint, hand_index: 6}
    - {ros_name: right_ring_joint, hand_index: 7}
    - {ros_name: right_middle_joint, hand_index: 8}
    - {ros_name: right_index_joint, hand_index: 9}
    - {ros_name: right_thumb_joint, hand_index: 10}
    - {ros_name: right_thumb_lateral_joint, hand_index: 11}
