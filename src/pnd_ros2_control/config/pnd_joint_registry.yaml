    - {sdk_name: LeftAnkleRoll, ros_name: left_ankle_roll_joint, sdk: 5, ctrl: 5, group: left_leg, kp: 0, kd: 0.25}
    - {sdk_name: RightHipPitch, ros_name: right_hip_pitch_joint, sdk: 6, ctrl: 6, group: right_leg, kp: 305, kd: 6.1}
